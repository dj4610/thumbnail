<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YT Studio Pro Mobile</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --panel-bg: #1e1e1e;
            --accent: #ff0000;
            --accent-light: #00e5ff;
            --text-color: #efefef;
            --border: #333;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0; background-color: var(--bg-dark); color: var(--text-color);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            touch-action: none;
        }

        header {
            height: 50px; background: var(--panel-bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100;
        }

        .export-btn {
            background: var(--accent); color: white; border: none; padding: 8px 15px;
            border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px;
        }

        main { display: flex; flex: 1; overflow: hidden; flex-direction: row; }

        /* Sidebar Responsive */
        .sidebar {
            width: 70px; background: var(--panel-bg); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px;
        }

        .tool { text-align: center; font-size: 10px; cursor: pointer; opacity: 0.7; }
        .tool i { font-size: 20px; display: block; margin-bottom: 4px; }

        .workspace {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: #151515; padding: 10px; overflow: hidden; position: relative;
        }

        .canvas-container {
            max-width: 100%; max-height: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            touch-action: none;
        }

        canvas { 
            max-width: 100%; height: auto !important; 
            background: #000; display: block;
        }

        .right-panel {
            width: 300px; background: var(--panel-bg); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; font-size: 13px;
        }

        .scroll-area { flex: 1; overflow-y: auto; padding: 15px; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            main { flex-direction: column; }
            .sidebar { 
                width: 100%; height: 60px; flex-direction: row; 
                order: 2; padding: 0; justify-content: space-around; border-top: 1px solid var(--border);
            }
            .right-panel { width: 100%; height: 40%; order: 3; }
            .workspace { order: 1; flex: 1; }
        }

        input[type="text"], input[type="number"], select {
            width: 100%; background: #2a2a2a; border: 1px solid #444; color: white; 
            padding: 8px; border-radius: 5px; margin-bottom: 10px;
        }

        .layer-item {
            background: #2a2a2a; padding: 8px; margin-bottom: 5px; border-radius: 4px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .layer-item.active { border-left: 3px solid var(--accent-light); background: #333; }
        
        .btn-row { display: flex; gap: 5px; margin-top: 10px; }
        .btn-sub { flex: 1; padding: 8px; background: #333; border: 1px solid #444; color: white; cursor: pointer; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; font-size: 14px;">YT<span style="color:var(--accent)">STUDIO</span></div>
    <select id="resSelect" onchange="changeResolution()" style="width: auto; margin: 0; font-size: 11px;">
        <option value="1280x720">HD (16:9)</option>
        <option value="1080x1920">Shorts (9:16)</option>
    </select>
    <button class="export-btn" onclick="exportImage()">SIMPAN</button>
</header>

<main>
    <div class="sidebar">
        <div class="tool" onclick="document.getElementById('imgInp').click()"><i>🖼️</i>Media</div>
        <div class="tool" onclick="addText()"><i>T</i>Teks</div>
        <div class="tool" onclick="moveL('up')"><i>▲</i>Naik</div>
        <div class="tool" onclick="moveL('down')"><i>▼</i>Turun</div>
    </div>

    <div class="workspace">
        <div class="canvas-container" id="canvasWrap">
            <canvas id="c" width="1280" height="720"></canvas>
        </div>
    </div>

    <div class="right-panel">
        <div class="scroll-area">
            <div id="propView" style="display:none">
                <h4 style="margin:0 0 10px 0; color:var(--accent-light)">PENGATURAN OBJEK</h4>
                
                <label>Isi Teks</label>
                <input type="text" id="tContent" oninput="upd()">
                
                <div style="display:flex; gap:10px">
                    <div style="flex:1">
                        <label>Warna</label>
                        <input type="color" id="tColor" oninput="upd()" style="height:40px">
                    </div>
                    <div style="flex:1">
                        <label>Outline</label>
                        <input type="color" id="sColor" value="#000000" oninput="upd()" style="height:40px">
                    </div>
                </div>

                <label>Ukuran Font</label>
                <input type="range" id="fSize" min="20" max="300" oninput="upd()">

                <div class="btn-row">
                    <button class="btn-sub" onclick="del()" style="background:#422">Hapus</button>
                    <button class="btn-sub" onclick="sel.x = c.width/2; sel.y = c.height/2; render()">Tengah</button>
                </div>
            </div>
            
            <div id="noSel" style="text-align:center; opacity:0.5; padding:20px">Klik objek di kanvas</div>
            
            <hr style="border:0; border-top:1px solid #333; margin:15px 0">
            <div id="layerList"></div>
        </div>
    </div>
</main>

<input type="file" id="imgInp" accept="image/*" onchange="handleImg(this)">

<script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    let layers = [];
    let sel = null;
    let dragging = false, resizing = false;
    let off = { x: 0, y: 0 }, startD = 0, startS = 1;

    // Inisialisasi awal
    function changeResolution() {
        const [w, h] = document.getElementById('resSelect').value.split('x');
        c.width = parseInt(w); c.height = parseInt(h);
        render();
    }

    function addText() {
        const obj = {
            id: Date.now(), name: 'Teks', type: 'text',
            txt: 'KLIK DISINI', x: c.width/2, y: c.height/2,
            fSize: 80, font: 'Impact', col: '#ffffff', sCol: '#000000',
            rot: 0, scale: 1, sWidth: 8
        };
        layers.push(obj); select(obj);
    }

    function handleImg(input) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const scale = (c.width * 0.5) / img.width;
                layers.push({
                    id: Date.now(), name: 'Gambar', type: 'img',
                    img: img, x: c.width/2, y: c.height/2,
                    w: img.width, h: img.height, rot: 0, scale: scale
                });
                select(layers[layers.length-1]);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }

    function render() {
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, c.width, c.height);

        layers.forEach(l => {
            ctx.save();
            ctx.translate(l.x, l.y);
            ctx.rotate(l.rot * Math.PI / 180);
            ctx.scale(l.scale, l.scale);

            if (l.type === 'text') {
                ctx.font = `bold ${l.fSize}px ${l.font}`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                
                // Stroke (Garis Tepi) - Khas YouTube
                ctx.strokeStyle = l.sCol;
                ctx.lineWidth = l.sWidth;
                ctx.lineJoin = 'round';
                ctx.strokeText(l.txt, 0, 0);
                
                ctx.fillStyle = l.col;
                ctx.fillText(l.txt, 0, 0);
                
                l.w = ctx.measureText(l.txt).width + 20;
                l.h = l.fSize;
            } else {
                ctx.drawImage(l.img, -l.w/2, -l.h/2, l.w, l.h);
            }

            if (l === sel) {
                ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 4 / l.scale;
                ctx.strokeRect(-l.w/2 - 10, -l.h/2 - 10, l.w + 20, l.h + 20);
            }
            ctx.restore();
        });
        updLayerUI();
    }

    function select(l) {
        sel = l;
        document.getElementById('noSel').style.display = l ? 'none' : 'block';
        document.getElementById('propView').style.display = l ? 'block' : 'none';
        if(l && l.type === 'text') {
            document.getElementById('tContent').value = l.txt;
            document.getElementById('tColor').value = l.col;
            document.getElementById('sColor').value = l.sCol;
            document.getElementById('fSize').value = l.fSize;
        }
        render();
    }

    function upd() {
        if (!sel) return;
        if (sel.type === 'text') {
            sel.txt = document.getElementById('tContent').value;
            sel.col = document.getElementById('tColor').value;
            sel.sCol = document.getElementById('sColor').value;
            sel.fSize = parseInt(document.getElementById('fSize').value);
        }
        render();
    }

    // Input Handling (Desktop & Mobile)
    c.addEventListener('pointerdown', (e) => {
        const rect = c.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (c.width / rect.width);
        const my = (e.clientY - rect.top) * (c.height / rect.height);

        for (let i = layers.length - 1; i >= 0; i--) {
            const l = layers[i];
            const dx = mx - l.x, dy = my - l.y;
            const dist = Math.hypot(dx, dy);
            if (dist < (l.w / 2) * l.scale || dist < 50) {
                select(l); dragging = true;
                off.x = dx; off.y = dy;
                return;
            }
        }
        select(null);
    });

    window.addEventListener('pointermove', (e) => {
        if (!dragging || !sel) return;
        const rect = c.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (c.width / rect.width);
        const my = (e.clientY - rect.top) * (c.height / rect.height);

        let newX = mx - off.x;
        let newY = my - off.y;

        // Snap to Center Logic
        if (Math.abs(newX - c.width/2) < 20) newX = c.width/2;
        if (Math.abs(newY - c.height/2) < 20) newY = c.height/2;

        sel.x = newX; sel.y = newY;
        render();
    });

    window.addEventListener('pointerup', () => dragging = false);

    function moveL(dir) {
        if (!sel) return;
        const idx = layers.indexOf(sel);
        if (dir === 'up' && idx < layers.length - 1) {
            [layers[idx], layers[idx+1]] = [layers[idx+1], layers[idx]];
        } else if (dir === 'down' && idx > 0) {
            [layers[idx], layers[idx-1]] = [layers[idx-1], layers[idx]];
        }
        render();
    }

    function updLayerUI() {
        const list = document.getElementById('layerList');
        list.innerHTML = '';
        [...layers].reverse().forEach(l => {
            const d = document.createElement('div');
            d.className = `layer-item ${l === sel ? 'active' : ''}`;
            d.innerHTML = `<span>${l.name}</span> <small>${l.type}</small>`;
            d.onclick = () => select(l);
            list.appendChild(d);
        });
    }

    function del() { layers = layers.filter(l => l !== sel); select(null); }

    function exportImage() {
        select(null);
        setTimeout(() => {
            const link = document.createElement('a');
            link.download = 'thumbnail-pro.png';
            link.href = c.toDataURL('image/png', 1.0);
            link.click();
        }, 100);
    }
</script>
</body>
</html>
